# DEFCON framework spec for nautilus-institute/finals-2025 :: ico
#
# Authored by us (the upstream repo doesn't ship hosting infra). The
# adapter `challenges.nautilus.NautilusSource` reads this file and
# produces a `ChallengeSpec` consumed by the rest of the framework.

name = "nautilus-ico"
source = "nautilus"
port = 4265
flag_mechanism = "file_at_path"
flag_path = "/flag"

# Path inside the runtime container where the agent edits source. Baked
# into the image at build time from `vendor/nautilus-finals-2025/ico/service/`;
# the container entrypoint then copies it to the writable workdir
# /srv/challenge/ico/. NEVER a host bind mount.
source_view = "service"

# Framework-owned restart script. Lives at this path inside the image,
# root-owned 555 (read+exec, not write). The MCP `restart_service` tool
# invokes this via `docker exec`; the agent cannot call it directly and
# cannot modify it.
restart_cmd = "/arena/restart.sh"

[health_check]
# What pgrep matches to confirm PROCESS-level liveness.
process_pattern = "/srv/challenge/ico/ico"
# Path to the gameplay-correctness checker (CHECKER level). Same
# protections as restart.sh — baked, root-owned, outside source_view.
checker_command = "/arena/checker.sh"
