# Cyber Arena — nautilus-ico ASYNC-mode match configuration.
#
# Same ico topology as config/game_ico.yaml (Pascal HVIF server on port 4265,
# per-team attack networks), but `round_config.mode: async` runs the async
# driver: one long-lived supervised agent per team, networks always connected
# (attack + defense simultaneous at Phase.LIVE), a round tick that only rotates
# flags every `round_secs`. Unlike the notes async sample, ico is
# defense-capable (has a restart_handler + checker), so this exercises the full
# async surface: continuous attack AND defense (restart_service under live
# fire) AND continuous health polling.
#
# Image cyberarena/chal-nautilus-ico:<sha> must already be built
# (`python main.py setup -c config/game_ico.yaml`, after scripts/sync_nautilus.sh).

teams:
  - id: team1
    dev: team1_dev
    prod: team1_prod
    token: dev-team1-token
    agent:
      cli: claude -p --dangerously-skip-permissions --output-format stream-json --verbose
      model: claude-sonnet-4-6
      api_key: ${ANTHROPIC_API_KEY_TEAM1}
      base_url: ${ANTHROPIC_BASE_URL_TEAM1}
  - id: team2
    dev: team2_dev
    prod: team2_prod
    token: dev-team2-token
    agent:
      cli: claude -p --dangerously-skip-permissions --output-format stream-json --verbose
      model: claude-sonnet-4-6
      api_key: ${ANTHROPIC_API_KEY_TEAM2}
      base_url: ${ANTHROPIC_BASE_URL_TEAM2}

nodes:
  - id: team1_dev
    image: cyberarena/dev-base
    networks: [team1_net, attack_net_team1]
    install_list: []
    extra_hosts:
      host.docker.internal: host-gateway

  - id: team1_prod
    image: cyberarena/chal-nautilus-ico:366520c0cc43
    networks: [team1_net, game_net, attack_net_team2]
    ports: ["127.0.0.1:8001:4265"]
    install_list: []

  - id: team2_dev
    image: cyberarena/dev-base
    networks: [team2_net, attack_net_team2]
    install_list: []
    extra_hosts:
      host.docker.internal: host-gateway

  - id: team2_prod
    image: cyberarena/chal-nautilus-ico:366520c0cc43
    networks: [team2_net, game_net, attack_net_team1]
    ports: ["127.0.0.1:8002:4265"]
    install_list: []

networks:
  team1_net:
    subnet: 10.1.0.0/24
  team2_net:
    subnet: 10.2.0.0/24
  game_net:
    subnet: 10.0.0.0/24
  attack_net_team1:
    subnet: 10.11.0.0/24
  attack_net_team2:
    subnet: 10.12.0.0/24

challenges:
  - name: nautilus-ico
    type: nautilus-ico
    port: 4265
    deploy_on: [team1, team2]

round_config:
  mode: async
  round_secs: 120     # flag-rotation interval; the agent runs continuously across ticks
  total_rounds: 3     # ~6 min of play; agent attacks + patches simultaneously
