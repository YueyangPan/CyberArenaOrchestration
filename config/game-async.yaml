# Cyber Arena — ASYNC-mode match configuration.
#
# Same topology as config/game.yaml, but `round_config.mode: async` switches
# the orchestrator to async mode:
#   - one long-lived supervised agent per team (prompted once, respawned with
#     --continue if it exits early), driving itself via get_game_state over MCP;
#   - cross-team networks stay connected the whole game (attack + defense run
#     simultaneously at Phase.LIVE — no protected patch window);
#   - the "round" tick only rotates flags every `round_secs`; submission and
#     health checks run continuously.
#
# Note: the bundled `notes` challenge is ATTACK-ONLY (no restart capability),
# so the async agent's defense half collapses to a no-op for it — this sample
# mainly exercises the continuous-attack + flag-rotation path. For a full
# attack+defense async demo, point the prod containers at a defense-capable
# challenge (e.g. nautilus-ico, as in config/game_ico.yaml) and keep this
# round_config block.

teams:
  - id: team1
    dev: team1_dev
    prod: team1_prod
    token: dev-team1-token
    agent:
      cli: claude -p --dangerously-skip-permissions --output-format stream-json --verbose
      model: claude-sonnet-4-6
      api_key: ${ANTHROPIC_API_KEY_TEAM1}
      base_url: ${ANTHROPIC_BASE_URL_TEAM1}
  - id: team2
    dev: team2_dev
    prod: team2_prod
    token: dev-team2-token
    agent:
      cli: claude -p --dangerously-skip-permissions --output-format stream-json --verbose
      model: claude-sonnet-4-6
      api_key: ${ANTHROPIC_API_KEY_TEAM2}
      base_url: ${ANTHROPIC_BASE_URL_TEAM2}

nodes:
  - id: team1_dev
    image: cyberarena/dev-base
    networks: [team1_net]
    install_list: []
    extra_hosts:
      host.docker.internal: host-gateway

  - id: team1_prod
    image: cyberarena/chal-notes:v1
    networks: [team1_net, game_net]
    ports: ["127.0.0.1:8001:5000"]
    install_list: []

  - id: team2_dev
    image: cyberarena/dev-base
    networks: [team2_net]
    install_list: []
    extra_hosts:
      host.docker.internal: host-gateway

  - id: team2_prod
    image: cyberarena/chal-notes:v1
    networks: [team2_net, game_net]
    ports: ["127.0.0.1:8002:5000"]
    install_list: []

networks:
  team1_net:
    subnet: 10.1.0.0/24
  team2_net:
    subnet: 10.2.0.0/24
  game_net:
    subnet: 10.0.0.0/24

challenges:
  - name: notes
    type: notes
    port: 5000
    deploy_on: [team1, team2]

round_config:
  mode: async
  round_secs: 60       # flag-rotation interval (one "round" tick)
  total_rounds: 3      # game ends after this many rotations (~3 minutes here)
