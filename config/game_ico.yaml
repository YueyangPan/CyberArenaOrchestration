# Cyber Arena — nautilus-ico match configuration
#
# Same topology as config/game.yaml but the prod containers run the
# nautilus-ico image (Pascal HVIF server, port 4265) instead of the
# generic prod-base + notes service.
#
# Image cyberarena/chal-nautilus-ico:<sha> is built by
# `python main.py setup -c config/game_ico.yaml` via NautilusSource
# (in turn driven by challenges.registry.build_all_images). Run
# `scripts/sync_nautilus.sh` once before that to vendor the upstream
# source tree.

teams:
  - id: team1
    dev: team1_dev
    prod: team1_prod
    token: dev-team1-token
    agent:
      cli: claude -p --dangerously-skip-permissions --output-format stream-json --verbose
      model: claude-sonnet-4-6
      api_key: ${ANTHROPIC_API_KEY_TEAM1}
      base_url: ${ANTHROPIC_BASE_URL_TEAM1}
  - id: team2
    dev: team2_dev
    prod: team2_prod
    token: dev-team2-token
    agent:
      cli: claude -p --dangerously-skip-permissions --output-format stream-json --verbose
      model: claude-sonnet-4-6
      api_key: ${ANTHROPIC_API_KEY_TEAM2}
      base_url: ${ANTHROPIC_BASE_URL_TEAM2}

nodes:
  - id: team1_dev
    image: cyberarena/dev-base
    networks: [team1_net]
    install_list: []
    extra_hosts:
      host.docker.internal: host-gateway

  - id: team1_prod
    image: cyberarena/chal-nautilus-ico:366520c0cc43
    networks: [team1_net, game_net]
    ports: ["127.0.0.1:8001:4265"]
    install_list: []

  - id: team2_dev
    image: cyberarena/dev-base
    networks: [team2_net]
    install_list: []
    extra_hosts:
      host.docker.internal: host-gateway

  - id: team2_prod
    image: cyberarena/chal-nautilus-ico:366520c0cc43
    networks: [team2_net, game_net]
    ports: ["127.0.0.1:8002:4265"]
    install_list: []

networks:
  team1_net:
    subnet: 10.1.0.0/24
  team2_net:
    subnet: 10.2.0.0/24
  game_net:
    subnet: 10.0.0.0/24

challenges:
  - name: nautilus-ico
    type: nautilus-ico
    port: 4265
    deploy_on: [team1, team2]

round_config:
  # Defense + attack tuned a little longer than notes — ico's fpc rebuild
  # is ~1s and a real defense edit + agent turn takes more than the 10s
  # used for notes.
  defense_secs: 90
  attack_secs: 60
  total_rounds: 3
